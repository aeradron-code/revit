name: Validate database migrations

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/validate-migrations.yml"

permissions:
  contents: read

concurrency:
  group: database-migrations-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Rebuild local database from migrations
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Start local Postgres
        run: supabase db start

      - name: Apply all migrations to a clean local database
        run: supabase db reset --local --no-seed
